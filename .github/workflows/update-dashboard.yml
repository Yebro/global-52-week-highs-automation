name: Update 52-week highs dashboard

on:
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 52-week-highs-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect latest market data
        run: python collect.py

      - name: Select scheduled market session
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            slot="manual"
          elif [[ "$EVENT_SCHEDULE" == "0 7 * * 1-5" ]]; then
            slot="asia"
          else
            slot="us"
          fi
          python schedule_gate.py --slot "$slot"

      - name: Build dashboard
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python build_dashboard.py
          mkdir -p public
          cp dashboard.html public/index.html
          cp data/latest.json public/latest.json

      - name: Save refreshed data
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/cache
          git diff --cached --quiet || git commit -m "Update market data"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.should_publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.should_publish == 'true'
        with:
          path: public

      - name: Deploy dashboard data
        id: deployment
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/deploy-pages@v4

