name: Update 52-week highs dashboard

on:
  schedule:
    # GitHub scheduled events can be delayed. Backup attempts improve punctuality;
    # the precheck below makes later attempts no-ops after a successful update.
    - cron: "5,15,25,35,45,55 7 * * 1-5"
    - cron: "5,15,25,35,45,55 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 52-week-highs-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Plan scheduled market session
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            slot="manual"
          elif [[ "$EVENT_SCHEDULE" == "5,15,25,35,45,55 7 * * 1-5" ]]; then
            slot="asia"
          else
            slot="us"
          fi
          python schedule_gate.py --slot "$slot" --phase precheck

      - name: Collect latest market data
        if: steps.plan.outputs.should_collect == 'true'
        run: python collect.py

      - name: Confirm scheduled market session
        id: gate
        if: steps.plan.outputs.should_collect == 'true'
        run: python schedule_gate.py --slot "${{ steps.plan.outputs.slot }}" --phase postcheck

      - name: Build dashboard
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python build_dashboard.py
          mkdir -p public
          cp dashboard.html public/index.html
          cp data/latest.json public/latest.json
          if [ -d leader-watch/public ]; then
            mkdir -p public/leaders
            cp -R leader-watch/public/. public/leaders/
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.should_publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.should_publish == 'true'
        with:
          path: public

      - name: Deploy dashboard data
        id: deployment
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/deploy-pages@v4

      - name: Save refreshed data and published session
        if: steps.gate.outputs.should_publish == 'true' && steps.deployment.outcome == 'success'
        run: |
          python schedule_gate.py --slot "${{ steps.plan.outputs.slot }}" --phase mark
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/cache data/published_sessions.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push

      - name: Notify Telegram
        if: steps.gate.outputs.should_publish == 'true' && steps.deployment.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
